<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>lista2</title>

  <body>
    <header>
      <h1 id="nome">A lista²</h1>

    <main class="container">
      <h1>Lista de Things</h1>
      <p>Adicione aqui qualquer coisa</p>

        <input id="titulo" type="text" placeholder="Nome da coisa" required />

      <p id="mensagens"></p>
      <h2>Coisas listadas</h2>
      <ul id="lista-coisas"></ul>
    </main>
    <footer><h1>O fim da lista²?</h1>
    </footer>
    <script type="module" src="main.js"></script>
  </body>
